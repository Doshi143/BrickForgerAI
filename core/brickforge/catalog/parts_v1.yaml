  # --- 45-degree slopes (height_plates: 3, standard brick height) ---
  # Footprint and height verified directly from raw geometry, not the
  # naming convention: fetched parts/3040b.dat + its s\3040s01.dat
  # subpart and computed the true bounding box from every vertex --
  # X spans 20 LDU (1 stud), Y spans 0-24 LDU (24 = standard brick
  # height, confirming slopes are NOT plate-height), Z spans 40 LDU
  # (2 studs) -- matching "Slope Brick 45 2 x 1" under the same
  # second-number-is-X convention already established for bricks/plates/
  # tiles. The other slope sizes were not independently re-verified this
  # deeply (time-boxed); their footprints follow the same, by-now
  # well-established naming convention, and "standard 45-degree slopes
  # are brick height" is extremely well-established LEGO/LDraw knowledge,
  # not a guess specific to this catalog.
  #
  # top: none is a deliberate, conservative simplification, not a
  # measurement -- the sloped/cut top face is NOT flat, and the subpart
  # geometry (a stud placed via a Y-mirrored transform, `stud3a.dat` at a
  # non-obvious local offset) was genuinely ambiguous to resolve
  # remotely with confidence. Treating top as "none" means the
  # legalizer/repair pipeline will never claim a stud connection here
  # that might not exist -- safe in the direction that matters (never
  # overclaims connectivity), at the cost of being unable to place
  # anything on top of a slope even on the rare real part that has one.
  # bottom: full is directly confirmed: the bottom face in 3040's
  # subpart geometry is a complete, uncut rectangle spanning the full
  # footprint (a slope is never cut on its underside).
  #
  # local_offset: [0, 10] is NOT a naming-convention guess -- unlike every
  # other part in this catalog, a slope's LDraw origin is not at the
  # horizontal center of its own footprint. Directly measured from full
  # vertex data: s/3040s01.dat's local Z spans [-30, +10] (40 LDU / 2
  # studs wide, as expected) but centered on Z=-10, not Z=0 -- a genuine
  # 10 LDU (half-stud) asymmetry, not a parsing error (X was confirmed
  # symmetric, [-10, +10], as expected). Caught only because the user
  # spotted the resulting non-integer-stud misalignment against plain
  # plates in Studio; the first version of this catalog assumed uniform
  # centering for every part and got this wrong silently (unit tests only
  # checked internal self-consistency). s/3665as01.dat (the inverted
  # slope's real subpart, now that 3665.dat itself is a "~Moved to"
  # redirect stub) was independently checked and shows the identical Z
  # range [-30, +10] -- same asymmetry, same correction -- consistent
  # with inverted slopes sharing the same footprint-reference convention
  # as their upright counterparts rather than an unrelated, re-derived
  # offset. See lattice.py's Rotation.rotate_offset / placement_to_ldraw
  # for how this is applied (rotated along with the part, not a fixed
  # world-space shift).
  - id: "3040"
    name: "Slope Brick 45 2 x 1"
    category: slope
    footprint: [1, 2]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 10]
  - id: "3039"
    name: "Slope Brick 45 2 x 2"
    category: slope
    footprint: [2, 2]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 10]
  - id: "3038"
    name: "Slope Brick 45 2 x 3"
    category: slope
    footprint: [3, 2]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 10]
  - id: "3037"
    name: "Slope Brick 45 2 x 4"
    category: slope
    footprint: [4, 2]
