  # --- 2-plate-height ("2/3 brick") slopes -- the real "detail" tier for
  # surface refinement. No standard rectangular slope exists at exactly 1
  # plate tall (searched brickarchitect.com/BrickLink's slope category,
  # came up empty, did not invent a part -- same rule already applied to
  # the missing 2x8 tile above); 2 plates (16 LDU) is the shallowest real
  # size, widely available as this width-1-through-4 family (54200/85984/
  # 7825/7835, LEGO's own "30/31 degree" naming -- cosmetic; the run
  # length in LDU is what the pipeline actually cares about, not the
  # angle name).
  #
  # Footprint verified from raw geometry, not the name, same discipline as
  # every other entry in this file: fetched parts/54200.dat + its
  # s/54200s01.dat subpart, and parts/85984.dat, parts/7825.dat,
  # parts/7835.dat directly (all four are simple, not subfiled further
  # except 54200). X (perpendicular width) spans exactly [1,2,3,4] studs
  # symmetric about 0 for the respective part -- no local_offset needed
  # there. Z (the run/incline direction) is a single stud (20 LDU),
  # nominally [-10, +10] (also centered at 0, unlike the 3-plate family)
  # -- the raw vertex data shows values like 9.3333/8.35 instead of a
  # clean 10 at one end, but that's corner-rounding from a later "Rounded
  # corners and flattened top" part revision (present in every one of
  # these four files' !HISTORY), not a real asymmetry like the 3-plate
  # slopes have. So local_offset: [0, 0] here is a measured conclusion,
  # not the default-by-omission it looks like -- don't copy the 3-plate
  # family's [0, 10] onto this one without re-checking; the two families
  # are not guaranteed to share an offset just because they're both
  # "slopes" (exactly the kind of per-part assumption this catalog has
  # been burned by twice already).
  #
  # y_anchor: bottom is the real finding here, and it's the reason this
  # family needed a new Part field at all (see lattice.py's module
  # docstring): every one of these four files' raw Y coordinates are all
  # <= 0 (the mirror image of every top-anchored part checked so far,
  # including the existing 3-plate slopes) -- and 61409's own
  # !HISTORY says so outright: "2009-03-30 [gregteft] Updated origin to
  # bottom center". Confirmed independently across all four widths, not
  # assumed from one part.
  - id: "54200"
    name: "Slope Brick 31 1 x 1"
    category: slope
    footprint: [1, 1]
    height_plates: 2
    top: none
    bottom: full
    local_offset: [0, 0]
    y_anchor: bottom
  - id: "85984"
    name: "Slope Brick 31 1 x 2"
    category: slope
    footprint: [2, 1]
    height_plates: 2
    top: none
    bottom: full
    local_offset: [0, 0]
    y_anchor: bottom
  - id: "7825"
    name: "Slope Brick 31 1 x 3"
    category: slope
    footprint: [3, 1]
    height_plates: 2
    top: none
    bottom: full
    local_offset: [0, 0]
    y_anchor: bottom
  - id: "7835"
    name: "Slope Brick 31 1 x 4"
    category: slope
    footprint: [4, 1]
    height_plates: 2
    top: none
    bottom: full
    local_offset: [0, 0]
    y_anchor: bottom

  # --- 33-degree slopes (height_plates: 3, standard brick height) -- a
  # second brick-height family alongside the 45-degree one above, added so
  # the Stage B seam-penalty loosening (legalize.py) has more than one
  # slope shape to opportunistically match against the extra bricks it now
  # produces. Deliberately scoped to run=3 (not the steeper 65/75-degree
  # families, which are 2-3 BRICKS tall -- a height tier this pipeline
  # doesn't support at all -- see pipeline/slopes.py's module docstring).
  #
  # Footprint verified from raw geometry, not the name, same discipline as
  # every other slope in this file: fetched parts/4286.dat (which, unlike
  # 3040, includes its sloped-face and side-face geometry directly rather
  # than pushing everything into a subpart) plus parts/3298.dat,
  # parts/4161.dat, parts/3297.dat and their s/*s01.dat subparts. X
  # (perpendicular width) spans exactly [1,2,3,4] studs symmetric about 0,
  # matching "3 x N" under the same second-number-is-X convention already
  # established -- footprint here is [N, 3], run=3 studs (NOT 2, like the
  # 45-degree family -- confirmed directly, not assumed just because both
  # are brick-height 3-plate slopes). Y spans 0-24 LDU, confirming
  # top-anchored/brick-height like the 45-degree family (not bottom-
  # anchored like the 2-plate family).
  #
  # local_offset: [0, 20] -- Z spans [-50, +10] across all four widths (60
  # LDU / 3 studs, as expected for run=3) but centered on Z=-20, not Z=0: a
  # genuine asymmetry, same shape of finding as the 45-degree family's
  # [0, 10] (there, Z spanned [-30, +10] centered on Z=-10) but a DIFFERENT
  # magnitude, computed independently from this family's own measured
  # range rather than copied over.
  #
  # Orientation -- the one genuinely easy-to-get-wrong fact here, so it's
  # called out in detail: this family's sloped-face quad runs from
  # (Z=-10, Y=0) -- the TALL/uphill edge, at full height -- down to
  # (Z=-50, Y=20) -- near the THIN/downhill edge. In un-recentered local
  # terms, tall face is at the LESS-NEGATIVE Z end and downhill runs toward
  # MORE-NEGATIVE Z -- after recentering (local_offset above), that's tall-
  # at-+Z, downhill-at--Z. That is the MIRROR IMAGE of the 45-degree
  # family's own -Z-tall/+Z-downhill convention, despite both families
  # being brick-height 3-plate slopes -- height tier and orientation are
  # independent facts about a part, and assuming they correlate is exactly
  # the mistake that shipped the 2-plate family backwards once already.
  # 3298/4161/3297 all show the identical Z/Y pairing at their respective
  # widths, so this is a real family-wide fact, not a one-part fluke.
  # pipeline/slopes.py's `_FLIPPED_PART_IDS` lists these 4 part ids
  # explicitly for this reason -- see its module docstring. Pattern-matched
  # against the 45-degree family's already-Studio-verified rotation
  # mapping rather than independently re-verified in Studio for this exact
  # family; see examples/output/slope33_orientation_test.ldr, which still
  # needs the user's visual confirmation before this is fully closed (same
  # two-step "fix, then re-verify visually" discipline as every other
  # slope addition in this project).
  - id: "4286"
    name: "Slope Brick 33 3 x 1"
    category: slope
    footprint: [1, 3]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 20]
  - id: "3298"
    name: "Slope Brick 33 3 x 2"
    category: slope
    footprint: [2, 3]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 20]
  - id: "4161"
    name: "Slope Brick 33 3 x 3"
    category: slope
    footprint: [3, 3]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 20]
  - id: "3297"
    name: "Slope Brick 33 3 x 4"
    category: slope
    footprint: [4, 3]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 20]

  # --- SNOT (Studs Not On Top) -- Phase A, one part only. ---
  #
  # side_stud_face / side_stud_offset: see Part's own docstring in
  # parts.py for the exact semantics. Both fields verified from 87087's
  # raw .dat geometry (fetched from library.ldraw.org, not assumed from
  # the part name), the same discipline as every other catalog entry:
  # the part's own subfile placement line for its side stud --
  # `1 16 0 10 -10 1 0 0 0 0 1 0 1 0 stud2a.dat` -- puts the stud at
  # local (x=0, y=10, z=-10), i.e. centered in X (along=0), on the -Z
  # face (z=-10 is the extreme edge of the 1x1 footprint's Z range), at
  # 10 LDU down from the part's own top -- NOT the 12 LDU half-height a
  # naive "centered" assumption would give, a real measured asymmetry,
  # not a guess. This is deliberately the ONLY SNOT part added this
  # session -- DESIGN.md sec. 4.3 names five more (4070, 99207, 99780,
  # 44728, 4733) as the rest of the intended v2 set, left for a later
  # pass once Phase A's single coordinate-math proof is confirmed in
  # Studio; adding more before that confirmation would be building on an
  # unverified foundation.
  - id: "87087"
    name: "Brick 1 x 1 with Stud on 1 Side"
    category: snot
    footprint: [1, 1]
    height_plates: 3
    top: none
    bottom: full
    local_offset: [0, 0]
    side_stud_face: "-z"
    side_stud_offset: [0, 10]

  # --- SNOT, Phase B: a real "longer" SNOT brick, added at the user's
  # request so sideways attachment isn't limited to 1x1 studs. Fetched
  # 30414.dat's full raw geometry directly from library.ldraw.org (not
  # assumed from the name), same discipline as 87087 above and every other
  # entry in this file:
  #
  #   1 16 -30 10 -10 1 0 0 0 0 1 0 1 0 stud2a.dat
  #   1 16 -10 10 -10 1 0 0 0 0 1 0 1 0 stud2a.dat
  #   1 16  10 10 -10 1 0 0 0 0 1 0 1 0 stud2a.dat
  #   1 16  30 10 -10 1 0 0 0 0 1 0 1 0 stud2a.dat
  #
  # Four `stud2a.dat` placements (the SAME side-stud primitive 87087 uses)
  # at local X = -30, -10, 10, 30 -- symmetric about 0, 20 LDU (1 stud)
  # apart, exactly what side_stud_count: 4 with side_stud_offset [0, 10]
  # produces via Part.side_stud_local_positions() -- and all at Y=10,
  # Z=-10: the SAME "-z face, 10 LDU down from the top" convention as
  # 87087, not re-derived independently. Overall X span is -40..40 (80 LDU
  # / 4 studs, symmetric -- local_offset: [0, 0], no asymmetry unlike the
  # slope families), Z span -10..10 (1 stud), Y span 0..24 (top-anchored
  # brick height) -- footprint [4, 1] matches "Brick 1 x 4" under this
  # catalog's established second-number-is-X convention.
  #
  # Unlike 87087, this part is genuinely dual-purpose: its raw geometry
  # ALSO includes four ordinary `stud.dat` placements at Y=0 (the true
  # top face, standard un-scaled stud primitive) at the same four X
  # positions -- real top studs, not a naming assumption -- so this brick
  # can be built into the ordinary stud-up grid exactly like any other
  # 1x4 brick AND offer a 4-stud sideways attachment row on its -z face.
  # top: full (not none, unlike 87087, which has no top stud at all).
  - id: "30414"
    name: "Brick 1 x 4 with Studs on Side"
    category: snot
    footprint: [4, 1]
    height_plates: 3
    top: full
    bottom: full
    local_offset: [0, 0]
    side_stud_face: "-z"
    side_stud_offset: [0, 10]
    side_stud_count: 4
