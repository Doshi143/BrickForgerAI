# BrickForgerAI part catalog — v1 (Phase 0 / Phase 1 scope: bricks, plates, tiles only).
#
# Part numbers are LDraw/BrickLink part numbers, verified individually against
# brickarchitect.com, bricklink.com, and library.ldraw.org (see DESIGN.md
# references). The `.dat` extension is added at LDR-serialization time, not
# stored here.
#
# Fields:
#   footprint       [x_studs, z_studs] at YAW_0 (unrotated) orientation.
#   height_plates   part height in plate units (1 plate = 8 LDU, 1 brick = 3 plates).
#   top             stud connector coverage on the top face:
#                      full  -> a stud at every (x, z) cell of the footprint
#                      none  -> no studs (tiles)
#   bottom          anti-stud/tube connector coverage on the bottom face:
#                      full  -> can receive a stud at every (x, z) cell
#                    (no v1 part has anything other than "full" bottom; the
#                    field exists because SNOT parts in a later catalog
#                    version will not)
#
# top/bottom are deliberately coarse (full-grid coverage, not real per-tube
# geometry) — enough to build a connectivity graph for the Phase 2 structural
# solver. Do not treat this as authoritative part geometry.
#
# IMPORTANT — footprint axis convention, verified against raw geometry (not
# assumed from the part name): for an LDraw part officially named "A x B",
# the LONGER/second number (B) runs along local X and the shorter/first
# number (A) runs along local Z. Confirmed by fetching and inspecting the
# actual quad coordinates in parts/3010.dat (Brick 1 x 4: X spans 80 LDU/4
# studs, Z spans 20 LDU/1 stud), parts/3004.dat (Brick 1 x 2: X=40/2 studs,
# Z=20/1 stud), and parts/3001.dat (Brick 2 x 4: X=80/4 studs, Z=40/2
# studs). So footprint below is [B, A], i.e. deliberately reversed from a
# naive reading of "A x B" -- e.g. "Brick 1 x 4" -> footprint: [4, 1], not
# [1, 4]. Square parts (A == B) are unaffected. Getting this backwards
# silently transposes every non-square part's occupancy 90 degrees from its
# true rendered footprint, which is exactly what happened in the first cut
# of this file (see brickforge/tests/test_parts.py for the regression
# tests that now pin this down).

